<!--
  C-Bench — Pin Map (viewN — GPIO breakout) — APPLE-STYLE
  720x720. iOS system colors + SF-style type.
  Physical: 2x20 right-angle 2.54mm header on the LEFT edge of the device.
  Facing the edge, pins point toward you; on-screen they sit at the left.
  On-screen layout mirrors that: dual pin strip pinned to the left, Row1 (top col)
  and Row2 (bottom col) net chips + per-pin notes, scrollable. Read-only page.
  Data source of truth: readme.md pin map (to be extended with this breakout table).
  NOTE: table documents 19 pin-pairs; header is 2x20 -> pair 20 shown as N.C.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Bench — Pin Map (Apple style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#FF9F0A; --cyan:#64D2FF; --purple:#BF5AF2; --green:#30D158; --red:#FF453A; --blue:#0A84FF; }
  [data-theme="dark"]{
    --bg:#000; --screenbg:#000; --card:#1C1C1E; --card2:#2C2C2E;
    --txt:#FFF; --txt2:rgba(235,235,245,.60); --txt3:rgba(235,235,245,.30);
    --sep:rgba(255,255,255,.07); --tabbar:rgba(20,20,22,.9);
    --bezel-a:#26262A; --bezel-b:#0A0A0C; --pin:#E9B44C; --pinedge:rgba(0,0,0,.5);
  }
  [data-theme="light"]{
    --bg:#F2F2F7; --screenbg:#F2F2F7; --card:#FFF; --card2:#FFF;
    --txt:#000; --txt2:rgba(60,60,67,.60); --txt3:rgba(60,60,67,.30);
    --sep:rgba(60,60,67,.12); --tabbar:rgba(249,249,251,.92);
    --bezel-a:#D7DEE6; --bezel-b:#B7C2CE; --pin:#C79A2E; --pinedge:rgba(0,0,0,.25);
    --orange:#FF9500; --cyan:#32ADE6; --purple:#AF52DE; --green:#34C759; --red:#FF3B30; --blue:#007AFF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#050507; font-family:'Inter',-apple-system,system-ui,sans-serif;
        display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px 12px 40px; }
  .cap{ color:#5a6571; font-size:12px; letter-spacing:.04em; text-align:center; }
  .cap b{ color:#9aa6b2; }

  .device{ width:720px; height:720px; background:linear-gradient(160deg,var(--bezel-a),var(--bezel-b));
           border-radius:40px; padding:18px; box-shadow:0 40px 90px -24px #000, inset 0 1px 0 rgba(255,255,255,.18); transition:background .35s; }
  .screen{ width:100%; height:100%; background:var(--screenbg); border-radius:22px; overflow:hidden;
           position:relative; display:flex; flex-direction:column; transition:background .35s; }

  .top{ display:flex; align-items:center; justify-content:space-between; padding:22px 28px 4px; }
  .top .brand{ font-weight:700; font-size:17px; letter-spacing:-.01em; color:var(--txt); }
  .top .brand span{ color:var(--txt2); font-weight:500; }
  .tbtn{ width:38px; height:38px; border-radius:50%; border:none; background:var(--card);
         color:var(--txt); font-size:17px; cursor:pointer; display:grid; place-items:center; }
  .tbtn:active{ transform:scale(.92); }

  .hint{ display:flex; align-items:center; gap:8px; padding:2px 28px 8px; color:var(--txt2); font-size:12.5px; font-weight:500; }
  .hint .edge{ color:var(--orange); font-weight:700; }

  .body{ flex:1; overflow-y:auto; padding:6px 18px 4px; }
  .body::-webkit-scrollbar{ display:none; }

  /* legend */
  .legend{ display:flex; flex-wrap:wrap; gap:6px 12px; padding:2px 6px 12px; }
  .lg{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--txt2); }
  .lg i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  /* pin-pair rows */
  .pin{ display:grid; grid-template-columns:34px 1fr; gap:12px; padding:8px 4px; align-items:center; }
  .pin + .pin{ border-top:1px solid var(--sep); }
  .idx{ width:34px; height:34px; border-radius:9px; background:var(--card); color:var(--txt2);
        font-weight:700; font-size:13px; display:grid; place-items:center; }

  .rows{ display:flex; flex-direction:column; gap:6px; }
  .side{ display:grid; grid-template-columns:76px 1fr; gap:10px; align-items:center; }
  .netwrap{ display:flex; align-items:center; gap:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--pin); box-shadow:0 0 0 2px var(--pinedge); flex:none; }
  .net{ font-weight:700; font-size:13px; color:var(--txt); padding:3px 9px; border-radius:8px; background:var(--card); white-space:nowrap; }
  .note{ font-size:12px; font-weight:500; color:var(--txt2); line-height:1.25; }
  .note.mut{ color:var(--txt3); }
  .rl{ font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--txt3); }

  /* function tints applied to .net */
  .f-gnd { background:color-mix(in srgb, var(--txt3) 22%, transparent); color:var(--txt2); }
  .f-pwr { background:color-mix(in srgb, var(--green) 22%, transparent); color:var(--green); }
  .f-i2c { background:color-mix(in srgb, var(--purple) 22%, transparent); color:var(--purple); }
  .f-uart{ background:color-mix(in srgb, var(--cyan) 22%, transparent); color:var(--cyan); }
  .f-sp  { background:color-mix(in srgb, var(--orange) 22%, transparent); color:var(--orange); }
  .f-dbg { background:color-mix(in srgb, var(--blue) 22%, transparent); color:var(--blue); }
  .f-nc  { background:color-mix(in srgb, var(--txt3) 14%, transparent); color:var(--txt3); }

  /* tab bar */
  .tabs{ display:flex; background:var(--tabbar); backdrop-filter:blur(20px);
         border-top:1px solid var(--sep); }
  .tab{ flex:1; text-align:center; padding:14px 0 16px; font-size:11px; font-weight:600; color:var(--txt2); }
  .tab.on{ color:var(--orange); }
</style>

<div class="cap">C-Bench &nbsp;·&nbsp; <b>Pin Map</b> &nbsp; 720×720 &nbsp;·&nbsp; tap ◐ to toggle theme</div>

<div class="device" data-theme="dark" id="dev">
  <div class="screen">
    <div class="top">
      <div class="brand">C-Bench <span>· Pin Map</span></div>
      <button class="tbtn" onclick="var d=document.getElementById('dev');d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'">◐</button>
    </div>
    <div class="hint">◀ Header sits on the <span class="edge">left edge</span> · pins face you · Row 1 top / Row 2 bottom</div>

    <div class="body" id="list">
      <div class="legend">
        <span class="lg"><i style="background:var(--txt3)"></i>GND</span>
        <span class="lg"><i style="background:var(--green)"></i>Power</span>
        <span class="lg"><i style="background:var(--purple)"></i>I2C</span>
        <span class="lg"><i style="background:var(--cyan)"></i>UART</span>
        <span class="lg"><i style="background:var(--orange)"></i>Special fn</span>
        <span class="lg"><i style="background:var(--blue)"></i>SWD</span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab">Monitor</div><div class="tab">Profiles</div>
      <div class="tab">Battery</div><div class="tab on">Pin Map</div>
    </div>
  </div>
</div>

<script>
  // [row1 net, row1 class, row1 note], [row2 net, row2 class, row2 note]
  const PINS = [
    [["GND","f-gnd",""],                 ["GND","f-gnd",""]],
    [["IO0","",""],                       ["IO1","",""]],
    [["IO2","f-sp","INA260 ALERT (current amp)"], ["IO3","f-sp","MAX17048 QSTRT"]],
    [["IO4","",""],                       ["IO5","",""]],
    [["IO6","f-sp","STAT_3.3V (charger)"],["IO7","f-sp","CTL (charger pull)"]],
    [["IO8","f-uart","→ HMI Tx"],         ["IO9","f-uart","→ HMI Rx"]],
    [["IO10","",""],                      ["IO11","",""]],
    [["IO12","",""],                      ["IO13","",""]],
    [["IO14","",""],                      ["IO15","",""]],
    [["IO16","",""],                      ["IO17","",""]],
    [["IO18","",""],                      ["IO19","",""]],
    [["IO20","f-i2c","I2C SDA"],          ["IO21","f-i2c","I2C SCL"]],
    [["IO22","f-sp","AP33772S FLIP"],     ["IO23","",""]],
    [["IO24","",""],                      ["IO25","f-sp","AP33772S INT"]],
    [["ADC1","",""],                      ["ADC2","",""]],
    [["ADC3","",""],                      ["ADC2","",""]],
    [["SWCLK","f-dbg",""],                ["SWDIO","f-dbg",""]],
    [["GND","f-gnd",""],                  ["+3.3V","f-pwr",""]],
    [["+5V","f-pwr",""],                  ["GND","f-gnd",""]],
    [["Vbus","f-pwr","Source USB port voltage"], ["GND","f-gnd",""]],
  ];
  const list = document.getElementById('list');
  PINS.forEach((p, i) => {
    const [r1, r2] = p;
    const side = (rl, d) => `
      <div class="side">
        <div class="netwrap"><span class="dot"></span><span class="net ${d[1]}">${d[0]}</span></div>
        <div>${d[2] ? `<span class="rl">${rl}</span> <span class="note">${d[2]}</span>` : `<span class="rl">${rl}</span> <span class="note mut">—</span>`}</div>
      </div>`;
    const el = document.createElement('div');
    el.className = 'pin';
    el.innerHTML = `<div class="idx">${i+1}</div>
      <div class="rows">${side('R1', r1)}${side('R2', r2)}</div>`;
    list.appendChild(el);
  });
</script>
