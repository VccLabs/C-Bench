<!--
  C-Bench — "Saved!" toast/popup (view5 gift message) — APPLE-STYLE
  720x720. Shown briefly after Save; auto-dismisses (~1.5s) back to Settings.
  Build map (Giraffe): hidden container shown on Save, hidden by a timer.
    check glyph = image/svg   title/sub = labels
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-Bench — Saved popup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --green:#30D158; }
  [data-theme="dark"]{ --screenbg:#000; --card:#1C1C1E; --txt:#FFF; --txt2:rgba(235,235,245,.60);
    --sep:rgba(255,255,255,.07); --bezel-a:#26262A; --bezel-b:#0A0A0C; --scrim:rgba(0,0,0,.55); }
  [data-theme="light"]{ --screenbg:#F2F2F7; --card:#FFF; --txt:#000; --txt2:rgba(60,60,67,.60);
    --sep:rgba(60,60,67,.12); --bezel-a:#D7DEE6; --bezel-b:#B7C2CE; --green:#34C759; --scrim:rgba(0,0,0,.35); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#050507; font-family:'Inter',-apple-system,system-ui,sans-serif;
        display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px 12px 40px; }
  .cap{ color:#5a6571; font-size:12px; text-align:center; } .cap b{ color:#9aa6b2; }
  .controls button{ border:none; border-radius:999px; padding:9px 16px; font-family:inherit; font-weight:600;
        font-size:13px; cursor:pointer; background:#1c1c1e; color:#e5e5ea; border:1px solid #2c2c2e; }
  .device{ width:720px; height:720px; background:linear-gradient(160deg,var(--bezel-a),var(--bezel-b));
           border-radius:40px; padding:18px; box-shadow:0 40px 90px -24px #000; transition:background .35s; }
  .screen{ width:100%; height:100%; background:var(--screenbg); border-radius:22px; overflow:hidden;
           position:relative; display:grid; place-items:center; transition:background .35s; }
  .under{ position:absolute; inset:0; padding:26px 30px; opacity:.45; }
  .under .b{ font-weight:700; font-size:17px; color:var(--txt); } .under .b span{ color:var(--txt2); font-weight:500; }
  .scrim{ position:absolute; inset:0; background:var(--scrim); backdrop-filter:blur(6px); display:grid; place-items:center; }
  .toast{ width:360px; background:var(--card); border-radius:30px; padding:40px 30px 34px; text-align:center;
          border:1px solid var(--sep); box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
          display:flex; flex-direction:column; align-items:center; animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } }
  .ring{ width:104px; height:104px; border-radius:50%; display:grid; place-items:center; margin-bottom:22px;
         background:color-mix(in srgb,var(--green) 16%,transparent); }
  .ring svg{ width:56px; height:56px; }
  .ring path{ stroke:var(--green); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round;
              stroke-dasharray:40; stroke-dashoffset:40; animation:draw .45s .12s forwards ease; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .title{ font-size:28px; font-weight:800; color:var(--txt); letter-spacing:-.02em; }
  .sub{ font-size:16px; font-weight:500; color:var(--txt2); margin-top:8px; }
.okbtn{ margin-top:26px; width:100%; border:none; border-radius:16px; padding:16px;
          background:#0A84FF; color:#fff; font-family:inherit; font-weight:700; font-size:17px; cursor:pointer; }
  .okbtn:active{ transform:scale(.97); }
  [data-theme="light"] .okbtn{ background:#007AFF; }
</style>

<div class="cap">C-Bench — <b>Saved! popup</b> · auto-dismiss ~1.5s → Settings</div>
<div class="controls"><button onclick="replay()">Replay</button><button onclick="tog()">Toggle theme</button></div>

<div class="device" data-theme="dark">
  <div class="screen" id="screen">
    <div class="under"><div class="b">C-Bench<span> · Gift Message</span></div></div>
    <div class="scrim" id="scrim">
      <div class="toast" id="toast">
        <div class="ring"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
        <div class="title">Saved!</div>
        <div class="sub">Your gift message is set</div>
        <button class="okbtn" onclick="tog()">Awesome!</button>
      </div>
    </div>
  </div>
</div>

<script>
  function replay(){ var t=document.getElementById('toast'); t.style.animation='none'; void t.offsetWidth;
    t.style.animation='pop .35s cubic-bezier(.2,.9,.3,1.3)';
    t.querySelectorAll('path').forEach(function(p){ p.style.animation='none'; void p.getBBox; p.style.animation='draw .45s .12s forwards ease'; }); }
  function tog(){ var d=document.querySelector('.device'); d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'; }
</script>
